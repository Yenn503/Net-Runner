# Web app + network-appliance exploit arsenal — curated leads for the
# app-testing-specialist and infra-specialist. Every entry is a LEAD:
# validate against the live target under scope. Full schema in ../README.md.
exploits:
  - id: log4shell
    cve: CVE-2021-44228
    name: Log4Shell — Apache Log4j2 JNDI remote code execution
    exploit_type: rce
    affected_versions: Apache Log4j2 2.0-beta9 – 2.14.1
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2021-44228
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2021-44228
    reliability: high
    validation_status: unvalidated
    prerequisites: An app field whose value reaches a vulnerable Log4j2 logger
    execution_environment: network
    detection_notes: CISA KEV. ${jndi:} strings and outbound LDAP/RMI are heavily signatured by WAF/IDS
    execution_adapter: nuclei
    operator_notes: Confirm blind hits with the oob-verification skill.

  - id: citrix-bleed
    cve: CVE-2023-4966
    name: Citrix Bleed — NetScaler ADC/Gateway session-token disclosure
    exploit_type: info-disclosure
    affected_versions: Citrix NetScaler ADC & Gateway 13.1 / 14.1 (pre-patch)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2023-4966
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2023-4966
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to the NetScaler appliance
    execution_environment: network
    detection_notes: CISA KEV. Oversized HTTP responses + token reuse from a new IP are the signals
    execution_adapter: nuclei
    operator_notes: Leaks valid session tokens → MFA-bypassing session hijack.

  - id: moveit-sqli
    cve: CVE-2023-34362
    name: MOVEit Transfer — SQL injection to remote code execution
    exploit_type: rce
    affected_versions: Progress MOVEit Transfer (pre-May-2023 patch)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2023-34362
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2023-34362
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to the MOVEit web interface
    execution_environment: network
    detection_notes: CISA KEV. Webshell drop (human2.aspx-style) and anomalous SQL are well-signatured post-Cl0p
    execution_adapter: manual
    operator_notes: Pre-auth SQLi chain to webshell. The Cl0p mass-exploitation CVE.

  - id: panos-globalprotect
    cve: CVE-2024-3400
    name: PAN-OS GlobalProtect command injection
    exploit_type: rce
    affected_versions: Palo Alto PAN-OS 10.2 / 11.0 / 11.1 with GlobalProtect + device telemetry
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2024-3400
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2024-3400
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to the GlobalProtect portal
    execution_environment: network
    detection_notes: CISA KEV. Malformed SESSID cookie + filesystem writes under the web root
    execution_adapter: nuclei
    operator_notes: Pre-auth OS command injection → root.

  - id: screenconnect-auth-bypass
    cve: CVE-2024-1709
    name: ConnectWise ScreenConnect authentication bypass
    exploit_type: auth-bypass
    affected_versions: ConnectWise ScreenConnect <= 23.9.7
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2024-1709
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2024-1709
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to the ScreenConnect web UI
    execution_environment: network
    detection_notes: CISA KEV. A new admin user appearing in the User.xml is the tell
    execution_adapter: nuclei
    operator_notes: Path-traversal auth bypass creates an admin user. Chain with CVE-2024-1708 for RCE.

  - id: activemq-rce
    cve: CVE-2023-46604
    name: Apache ActiveMQ OpenWire deserialization RCE
    exploit_type: rce
    affected_versions: Apache ActiveMQ < 5.15.16 / 5.16.7 / 5.17.6 / 5.18.3 (OpenWire :61616)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2023-46604
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2023-46604
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to the OpenWire port (61616)
    execution_environment: network
    detection_notes: CISA KEV. Outbound fetch of a remote Spring XML on broker start
    execution_adapter: metasploit
    operator_notes: Pre-auth RCE via crafted OpenWire marshalled exception class.

  - id: confluence-broken-access
    cve: CVE-2023-22515
    name: Atlassian Confluence broken access control — admin takeover
    exploit_type: auth-bypass
    affected_versions: Confluence Data Center & Server 8.0 – 8.5.1
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2023-22515
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2023-22515
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to the Confluence instance
    execution_environment: network
    detection_notes: CISA KEV. /setup/* requests post-install and a new admin account
    execution_adapter: nuclei
    operator_notes: Reset setup state, create an admin account. Pre-auth.

  - id: spring4shell
    cve: CVE-2022-22965
    name: Spring4Shell — Spring Framework data-binding RCE
    exploit_type: rce
    affected_versions: Spring Framework < 5.2.20 / 5.3.18 running on JDK 9+ with WAR-packaged Tomcat
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2022-22965
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2022-22965
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to a vulnerable Spring app accepting POJO-bound parameters; JDK 9+; Tomcat WAR deployment
    execution_environment: network
    detection_notes: CISA KEV. Crafted class.module.classLoader.* parameters and webshell writes under the Tomcat work directory
    execution_adapter: nuclei
    operator_notes: Pre-auth RCE via class-loader binding. Fingerprint the JDK + packaging first — Spring Boot uber-JARs are not vulnerable.

  - id: text4shell
    cve: CVE-2022-42889
    name: Text4Shell — Apache Commons Text interpolator RCE
    exploit_type: rce
    affected_versions: Apache Commons Text 1.5 – 1.9 (apps using StringSubstitutor with default interpolators)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2022-42889
    source: https://nvd.nist.gov/vuln/detail/CVE-2022-42889
    reliability: medium
    validation_status: unvalidated
    prerequisites: An app field whose value reaches StringSubstitutor.replace() with default interpolators
    execution_environment: network
    detection_notes: ${script:...}, ${dns:...}, ${url:...} interpolator strings outbound; oob-verification confirms blind hits
    execution_adapter: nuclei
    operator_notes: Smaller blast radius than Log4Shell — most callers do not enable the script interpolator by default; confirm reachability before claiming.

  - id: nextjs-middleware-bypass
    cve: CVE-2025-29927
    name: Next.js middleware authorization bypass
    exploit_type: auth-bypass
    affected_versions: Next.js 11.1.4 – 15.2.2 (self-hosted, middleware-based auth)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2025-29927
      - https://nextjs.org/blog/cve-2025-29927
    source: https://nvd.nist.gov/vuln/detail/CVE-2025-29927
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to a self-hosted Next.js app enforcing auth in middleware (Vercel-hosted apps are not affected)
    execution_environment: network
    detection_notes: Inbound x-middleware-subrequest header on non-internal paths; auth-bypassed access patterns in app logs
    execution_adapter: nuclei
    operator_notes: Add x-middleware-subrequest with the middleware path repeated 5x to skip middleware execution. Confirm self-hosted Next.js + middleware-based auth before firing.

  - id: proxylogon
    cve: CVE-2021-26855
    name: ProxyLogon — Microsoft Exchange SSRF + auth bypass (HAFNIUM chain)
    exploit_type: rce
    affected_versions: Exchange Server 2013 / 2016 / 2019 (pre-Mar-2021 patch)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2021-26855
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2021-26855
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to the Exchange front-end (OWA / Autodiscover)
    execution_environment: network
    detection_notes: CISA KEV. Autodiscover SSRF with X-AnonResource-Backend cookie; webshell drops under ECP / FrontEnd HttpProxy directories
    execution_adapter: metasploit
    operator_notes: Chain with CVE-2021-26857/26858/27065 for full RCE → DA. The HAFNIUM mass-exploitation chain.

  - id: proxyshell
    cve: CVE-2021-34473
    name: ProxyShell — Microsoft Exchange pre-auth RCE chain
    exploit_type: rce
    affected_versions: Exchange Server 2013 / 2016 / 2019 (chains CVE-2021-34473 + 34523 + 31207)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2021-34473
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2021-34473
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to OWA / Autodiscover; mailbox name discovery (LDAP or guess)
    execution_environment: network
    detection_notes: CISA KEV. Autodiscover path-confusion + arbitrary-PST-write to the IIS web root → webshell
    execution_adapter: metasploit
    operator_notes: Three-CVE chain → SYSTEM webshell. The Black Hat 2021 Orange Tsai chain.

  - id: proxynotshell
    cve: CVE-2022-41040
    name: ProxyNotShell — Microsoft Exchange SSRF + RCE
    exploit_type: rce
    affected_versions: Exchange Server 2013 / 2016 / 2019 (chains CVE-2022-41040 + 41082)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2022-41040
      - https://nvd.nist.gov/vuln/detail/CVE-2022-41082
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2022-41040
    reliability: high
    validation_status: unvalidated
    prerequisites: A valid mailbox-authenticated user (initial creds via phish / spray)
    execution_environment: network
    detection_notes: CISA KEV. PowerShell remoting path SSRF + autodiscover request anomalies
    execution_adapter: metasploit
    operator_notes: Authenticated chain → RCE. Worth chaining once any low-priv mailbox is owned.

  - id: f5-bigip-icontrol
    cve: CVE-2022-1388
    name: F5 BIG-IP iControl REST authentication bypass → RCE
    exploit_type: rce
    affected_versions: F5 BIG-IP 11.6.x / 12.1.x / 13.1.x / 14.1.x / 15.1.x / 16.1.x (pre-May-2022 hotfix)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2022-1388
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2022-1388
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to the BIG-IP management interface
    execution_environment: network
    detection_notes: CISA KEV. Connection-header smuggling on /mgmt/tm/util/bash endpoint
    execution_adapter: nuclei
    operator_notes: Header-confusion auth bypass → root-equivalent bash. Mgmt interface should not be internet-exposed but frequently is.

  - id: ivanti-connect-secure-cmdinject
    cve: CVE-2024-21887
    name: Ivanti Connect Secure / Policy Secure — auth-bypass + command injection chain
    exploit_type: rce
    affected_versions: Ivanti Connect Secure 9.x / 22.x and Policy Secure 9.x / 22.x (chained with CVE-2023-46805)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2024-21887
      - https://nvd.nist.gov/vuln/detail/CVE-2023-46805
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2024-21887
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to the appliance web interface
    execution_environment: network
    detection_notes: CISA KEV. /api/v1/license/keys-status SSRF + auth-bypass path traversal pattern
    execution_adapter: nuclei
    operator_notes: Mass-exploited 2024 chain → root webshell. Run the Ivanti integrity-checker tool after exploitation if cleanup is required.

  - id: fortios-format-string
    cve: CVE-2024-21762
    name: Fortinet FortiOS SSL VPN out-of-bounds write (pre-auth RCE)
    exploit_type: rce
    affected_versions: FortiOS 6.0 – 7.4.2 SSL VPN (pre-Feb-2024 patch)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2024-21762
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2024-21762
    reliability: medium
    validation_status: unvalidated
    prerequisites: Network reach to the FortiGate SSL VPN portal
    execution_environment: network
    detection_notes: CISA KEV. Crashes in sslvpnd and crafted HTTP chunked requests to /remote/* paths
    execution_adapter: manual
    operator_notes: Pre-auth memory-corruption RCE — characterise reliability in a lab FortiGate before live use; can panic the device.

  - id: veeam-backup-deserialization
    cve: CVE-2024-40711
    name: Veeam Backup & Replication deserialization RCE
    exploit_type: rce
    affected_versions: Veeam Backup & Replication < 12.2.0.334 (pre-Sept-2024 patch)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2024-40711
    source: https://nvd.nist.gov/vuln/detail/CVE-2024-40711
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to the Veeam backup server (default ports 9401 / 9392)
    execution_environment: network
    detection_notes: Ransomware-adjacent actors exploit this for backup destruction; expect EDR signatures on the .NET deserialization chain
    execution_adapter: manual
    operator_notes: Pre-auth deserialization → SYSTEM. Pair with the backup-recovery test scope; loss of backups is high-impact for the customer.

  - id: gitlab-account-takeover
    cve: CVE-2023-7028
    name: GitLab account takeover via password-reset email injection
    exploit_type: auth-bypass
    affected_versions: GitLab CE/EE 16.1 – 16.7.1 (pre-Jan-2024 patch)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2023-7028
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2023-7028
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to the GitLab instance; a target account's username/email
    execution_environment: network
    detection_notes: CISA KEV. Password-reset email sent to a second, attacker-controlled address visible in GitLab admin logs
    execution_adapter: nuclei
    operator_notes: Send password-reset email to the attacker via a second email parameter. No 2FA = full account takeover; with 2FA the bypass is partial.

  - id: vcenter-dcerpc
    cve: CVE-2021-21972
    name: VMware vCenter Server vSphere Client unauthenticated RCE
    exploit_type: rce
    affected_versions: VMware vCenter Server 6.5 / 6.7 / 7.0 (pre-Feb-2021 patch)
    references:
      - https://nvd.nist.gov/vuln/detail/CVE-2021-21972
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    source: https://nvd.nist.gov/vuln/detail/CVE-2021-21972
    reliability: high
    validation_status: unvalidated
    prerequisites: Network reach to the vCenter management UI (port 443)
    execution_environment: network
    detection_notes: CISA KEV. /ui/vropspluginui/rest/services/uploadova arbitrary file upload + crafted JSP webshell on disk
    execution_adapter: metasploit
    operator_notes: Pre-auth file upload → JSP webshell as root. Hypervisor admin is an excellent pivot to every guest.
