# Windows exploit arsenal — curated leads for the infra-specialist.
# Every entry is a LEAD: validate against the live target under scope before
# it counts as a finding. Full schema + field meanings in ../README.md.
exploits:
  - id: bluehammer
    cve: none
    name: BlueHammer — Windows Defender (windefend) vulnerability
    exploit_type: defense-evasion
    affected_versions: Windows Defender — windefend RPC interface (build-specific, verify)
    references:
      - https://github.com/Nightmare-Eclipse/BlueHammer
    source: https://github.com/Nightmare-Eclipse/BlueHammer
    reliability: unverified
    validation_status: unvalidated
    prerequisites: Local code execution on the target host
    execution_environment: windows-target
    detection_notes: Touches the windefend RPC surface — may itself be logged by Defender/EDR telemetry
    execution_adapter: manual
    operator_notes: Community PoC, no assigned CVE. Confirm Defender build/patch level first; behaviour is build-specific.

  - id: redsun
